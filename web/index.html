<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rummix</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./joker.png" />
  </head>
  <body>
    <div class="app home">
      <header class="hero home-hero">
        <div>
          <div class="badge">Daily Puzzle Set</div>
          <h1>Rummix - Daily Rummikub Puzzles</h1>
          <p class="subtitle">3 unique puzzles every day, choose your difficulty and see how fast you can solve the board.</p>
        </div>
        <div class="hero-actions">
          <a class="rules-link" href="./rules.html" aria-label="Rules">?</a>
        </div>
      </header>

      <main class="home-grid">
        <section class="difficulty-card easy">
          <div class="difficulty-tag">Easy</div>
          <h2>Warm Up</h2>
          <a class="play-link" href="./play.html?difficulty=easy">Play Easy</a>
        </section>

        <section class="difficulty-card medium">
          <div class="difficulty-tag">Medium</div>
          <h2>Daily Challenge</h2>
          <a class="play-link" href="./play.html?difficulty=medium">Play Medium</a>
        </section>

        <section class="difficulty-card hard">
          <div class="difficulty-tag">Hard</div>
          <h2>Expert Mode</h2>
          <a class="play-link" href="./play.html?difficulty=hard">Play Hard</a>
        </section>
      </main>

      <div class="creator-links" aria-label="Creator links">
        <a class="creator-credit" href="https://samwilton.org" target="_blank" rel="noopener noreferrer">
          &copy; Sam Wilton
        </a>
        <a class="creator-link" href="https://github.com/wiltos1" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg" alt="" />
        </a>
        <a class="creator-link" href="https://www.linkedin.com/in/sam-wilton-47b094286/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/linkedin.svg" alt="" />
        </a>
      </div>
    </div>
  </body>
</html>
